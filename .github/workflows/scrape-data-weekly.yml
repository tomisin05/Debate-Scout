name: Scrape Full Debate Data (Weekly)

on:
  schedule:
    # Sundays at 04:00 UTC.
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: debate-data-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check current data size
        id: current-size
        run: |
          if [ -f "public/data_ndtceda26.json" ]; then
            CURRENT_SIZE=$(jq 'if type == "array" then length else (.rounds | length) end' public/data_ndtceda26.json)
            echo "current_size=$CURRENT_SIZE" >> "$GITHUB_OUTPUT"
          else
            echo "current_size=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Run full scraper
        run: >-
          node scraper.mjs
          --year ndtceda26
          --output public/data_ndtceda26.json
          --phase all
          --requests-per-batch 25
          --batch-delay 60
        env:
          OPENCASELIST_USERNAME: ${{ secrets.OPENCASELIST_USERNAME }}
          OPENCASELIST_PASSWORD: ${{ secrets.OPENCASELIST_PASSWORD }}

      - name: Validate new data
        id: new-size
        run: |
          test -f public/data_ndtceda26.json
          jq -e '.rounds and (.rounds | type == "array")' public/data_ndtceda26.json > /dev/null
          NEW_SIZE=$(jq '.rounds | length' public/data_ndtceda26.json)
          echo "new_size=$NEW_SIZE" >> "$GITHUB_OUTPUT"

      - name: Commit full scrape changes
        run: |
          CURRENT_SIZE=${{ steps.current-size.outputs.current_size }}
          NEW_SIZE=${{ steps.new-size.outputs.new_size }}

          echo "Current size: $CURRENT_SIZE"
          echo "New size: $NEW_SIZE"

          if git diff --quiet -- public/data_ndtceda26.json; then
            echo "No data changes. Skipping commit."
            exit 0
          fi

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/data_ndtceda26.json
          git commit -m "Weekly full debate data scrape: $NEW_SIZE records"
          git push
