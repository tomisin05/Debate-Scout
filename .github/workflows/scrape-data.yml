name: Scrape Debate Data

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check current data size
        id: current-size
        run: |
          if [ -f "public/data_ndtceda26.json" ]; then
            CURRENT_SIZE=$(jq 'if type == "array" then length else (.rounds | length) end' public/data_ndtceda26.json)
            echo "current_size=$CURRENT_SIZE" >> $GITHUB_OUTPUT
          else
            echo "current_size=0" >> $GITHUB_OUTPUT
          fi

      - name: Scrape 2026 data
        run: node scraper.mjs --year ndtceda26 --output public/data_ndtceda26.json
        env:
          OPENCASELIST_USERNAME: ${{ secrets.OPENCASELIST_USERNAME }}
          OPENCASELIST_PASSWORD: ${{ secrets.OPENCASELIST_PASSWORD }}

      - name: Check new data size
        id: new-size
        run: |
          test -f public/data_ndtceda26.json
          jq -e '.rounds and (.rounds | type == "array")' public/data_ndtceda26.json > /dev/null
          NEW_SIZE=$(jq '.rounds | length' public/data_ndtceda26.json)
          echo "new_size=$NEW_SIZE" >> $GITHUB_OUTPUT

      - name: Compare and commit
        run: |
          CURRENT_SIZE=${{ steps.current-size.outputs.current_size }}
          NEW_SIZE=${{ steps.new-size.outputs.new_size }}

          echo "Current size: $CURRENT_SIZE"
          echo "New size: $NEW_SIZE"

          if [ "$NEW_SIZE" -gt "$CURRENT_SIZE" ]; then
            echo "New data has more records. Committing..."
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add public/data_ndtceda26.json
            if [ -f "scrape_errors_ndtceda26.json" ]; then
              git add scrape_errors_ndtceda26.json
            fi
            if [ -f "round_count_map_ndtceda26.json" ]; then
              git add round_count_map_ndtceda26.json
            fi
            git commit -m "Update debate data: $NEW_SIZE records (+$(($NEW_SIZE - $CURRENT_SIZE)))"
            git push
          else
            echo "No new data. Skipping commit."
          fi
